name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs the package through the dev extra, which also validates that
      # pyproject.toml builds correctly.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check boe_ingest agent tests

      # Offline tests: synthetic corpus, never touch the network.
      - name: Tests
        run: pytest -q

      # Offline smoke tests: read the registry and print agent config,
      # never touch the network or the index.
      - name: Smoke test
        run: |
          python -m boe_ingest list
          python -m agent info
